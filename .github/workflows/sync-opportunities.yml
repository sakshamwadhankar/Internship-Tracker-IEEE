# Free alternative to Cloud Functions: the scraper runs as a scheduled
# GitHub Action. Free for public repos, no billing account required.
#
# One-time setup (see README):
#   1. Create a Firebase service account key (JSON) and add its FULL
#      content as the repo secret FIREBASE_SERVICE_ACCOUNT_JSON.
#   2. Optionally add ADZUNA_APP_ID / ADZUNA_APP_KEY / JOOBLE_API_KEY /
#      CAREERJET_AFFID repo secrets to unlock those sources.

name: Sync opportunities

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # manual "Run workflow" button in the Actions tab

concurrency:
  group: opportunity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci --omit=dev

      - name: Run opportunity sync
        working-directory: functions
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
        run: node scripts/run-sync.js
